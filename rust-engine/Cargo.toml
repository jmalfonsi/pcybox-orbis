[package]
name = "orbis-engine"
version = "0.1.0"
edition = "2021"
description = "Experimental native capture engine for PCYBOX Orbis"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
